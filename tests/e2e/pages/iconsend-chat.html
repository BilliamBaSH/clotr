<!doctype html>
<!-- Stand-in for a chat whose send button has no "send" label: an icon in a div with
     role="button" (DeepSeek-style), next to a labeled Attach button. -->
<html lang="en">
<head><meta charset="utf-8"><title>Icon-send chat (Clotr test page)</title></head>
<body>
  <div class="composer" style="display:flex;gap:6px;align-items:flex-end;width:560px">
    <textarea id="chat-input" rows="3" style="flex:1"></textarea>
    <div id="attach" role="button" aria-label="Attach file" tabindex="0">📎</div>
    <button id="mode" aria-label="Open mode picker, currently Fast" type="button">Fast ▾</button>
    <div id="send" role="button" tabindex="0"><svg width="16" height="16" viewBox="0 0 16 16"><path d="M1 8h12M9 4l4 4-4 4" stroke="black" fill="none"/></svg></div>
  </div>
  <script>
    window.__sent = [];
    const box = document.getElementById("chat-input");
    function send() {
      if (!box.value.trim()) return;
      window.__sent.push(box.value);
      box.value = "";
      box.dispatchEvent(new Event("input", { bubbles: true })); // like frameworks do when they clear the box
    }
    document.getElementById("send").addEventListener("click", send);
    document.getElementById("attach").addEventListener("click", () => { window.__attachClicks = (window.__attachClicks || 0) + 1; });
    box.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } });
  </script>
</body>
</html>
