# On a version tag (v0.9.47 …): test, build the Chrome and Firefox zips, prove the build is
# reproducible, and create a DRAFT GitHub release with the zips, their SBOMs (SPDX) and SHA256SUMS.txt; in the public
# repo, also a signed build-provenance attestation (`gh attestation verify <zip> -R <repo>`).
# Nothing is published until a maintainer reviews the draft and presses Publish.
name: Release

on:
  push:
    tags: ["v*"]

# Least privilege: read-only by default; only the release job may write (to create the draft).
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # creating the draft release and uploading its files
      id-token: write # the provenance attestation's signing identity (public repo only)
      attestations: write # storing that attestation with the repo
    steps:
      # Actions pinned to exact commits (a moved tag can't change what runs); the tag is in the comment.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No dependency cache here (release review 2026-09-30): a release installs from the lockfile alone, never from
      # a cache another run wrote. setup-node v5 and later can cache by themselves, so it's switched off.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - name: The tag matches the extension's version
        run: |
          version="v$(node -p "require('./extension/manifest.json').version")"
          test "$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but manifest says $version"; exit 1; }
      - name: Build (Chrome, Brave, Edge and Firefox)
        run: |
          npm run package
          npm run package -- --firefox
      - name: Reproducible - a second build must be byte-identical
        run: |
          node tools/package.js --out "$RUNNER_TEMP/again"
          node tools/package.js --firefox --out "$RUNNER_TEMP/again"
          diff <(sort dist/SHA256SUMS.txt) <(sort "$RUNNER_TEMP/again/SHA256SUMS.txt")
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.spdx.json dist/SHA256SUMS.txt --draft \
            --title "Clotr $GITHUB_REF_NAME" \
            --notes "Install: unzip, then Load unpacked in chrome://extensions (Developer mode), or use the store listing. Verify: \`sha256sum -c SHA256SUMS.txt\`, or rebuild from this tag with \`npm ci && npm run package\` and compare. Provenance: \`gh attestation verify <zip> -R $GITHUB_REPOSITORY\`."
      # Signed record of which workflow run built each zip from which commit (SLSA provenance; free on public repos).
      - name: Build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.zip
