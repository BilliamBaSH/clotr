name: Commercial license
description: Use Clotr's code in a closed-source product or service, or ask about business terms.
title: "Commercial license: "
labels: ["commercial"]
body:
  - type: markdown
    attributes:
      value: |
        Clotr is free and open source under the GNU AGPL-3.0: anyone may use it, change it and share it, as long as shared or hosted changes stay open under the same license.
        A **commercial license** is for building Clotr's code into a product or service without that obligation.

        **This issue is public.** Keep it short; the maintainer will reply here to arrange a private conversation.
  - type: input
    id: organization
    attributes:
      label: Organization (optional)
  - type: textarea
    id: use
    attributes:
      label: What would you like to do with Clotr?
      description: For example, build its detection into your product, run it inside a hosted service, or roll it out to your staff with support.
    validations:
      required: true
